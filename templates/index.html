<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
async function initiatePayment(packageKey) {
    try {
        // Step 1: Create Order on Server
        const response = await fetch('/api/payment/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ package_key: packageKey })
        });

        const orderData = await response.json();

        if (!response.ok) {
            alert(orderData.error || 'Failed to initialize payment.');
            return;
        }

        // Step 2: Open Razorpay Gateway Modal
        const options = {
            "key": orderData.key_id,
            "amount": orderData.amount,
            "currency": orderData.currency,
            "name": "QRCraft Pro",
            "description": `Purchase ${orderData.package_name}`,
            "order_id": orderData.order_id,
            "handler": async function (razorpayResponse) {
                // Step 3: Verify Payment Signature on Server
                const verifyRes = await fetch('/api/payment/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        razorpay_order_id: razorpayResponse.razorpay_order_id,
                        razorpay_payment_id: razorpayResponse.razorpay_payment_id,
                        razorpay_signature: razorpayResponse.razorpay_signature
                    })
                });

                const verifyData = await verifyRes.json();

                if (verifyRes.ok && verifyData.success) {
                    alert(`🎉 Payment Successful! ${verifyData.new_credits} Credits available now.`);
                    location.reload(); // UI Refresh
                } else {
                    alert(verifyData.error || 'Payment verification failed.');
                }
            },
            "theme": {
                "color": "#38BDF8"
            }
        };

        const rzp = new Razorpay(options);
        rzp.open();

    } catch (err) {
        console.error("Payment Error:", err);
        alert("An unexpected error occurred.");
    }
}
</script>
