<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="YOUR_SEARCH_CONSOLE_CODE" />
    <title>QRCraft - Welcome</title>

    <!-- AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1786563700495703" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Neo-Brutalist Card Container */
        .card {
            background-color: #a2d2e2;
            border: 3px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            border-radius: 8px;
            width: 340px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 16px;
            font-weight: 600;
            color: #666666;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Neo-Brutalist Input Fields */
        .input-field {
            width: 100%;
            padding: 12px 16px;
            background-color: #fefae0;
            border: 2.5px solid #000000;
            border-radius: 8px;
            box-shadow: 3px 3px 0px #000000;
            font-size: 15px;
            font-weight: 700;
            color: #333333;
            outline: none;
            transition: all 0.1s ease;
        }

        .input-field::placeholder {
            color: #999999;
            font-weight: 600;
        }

        .input-field:focus {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000000;
        }

        /* Social Icons Section */
        .social-buttons {
            display: flex;
            gap: 16px;
            margin-top: 4px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #fefae0;
            border: 2.5px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
        }

        .social-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000000;
        }

        .social-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        /* Submit Button */
        .submit-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .submit-btn {
            background-color: #fefae0;
            border: 2.5px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.1s ease;
        }

        .submit-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        .submit-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Welcome,</h1>
            <p>sign up to continue</p>
        </div>

        <form id="authForm" class="form-group" onsubmit="handleAuth(event)">
            <input type="email" id="email" class="input-field" placeholder="Email" required />
            <input type="password" id="password" class="input-field" placeholder="Password" required />

            <div class="social-buttons">
                <div class="social-btn" onclick="socialLogin('twitter')">t</div>
                <div class="social-btn" onclick="socialLogin('google')">G</div>
                <div class="social-btn" onclick="socialLogin('facebook')">f</div>
            </div>

            <div class="submit-container">
                <button type="submit" class="submit-btn">
                    Let's go &rarr;
                </button>
            </div>
        </form>
    </div>

    <script>
        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Form Submit Logic
            alert("Logging in with Email: " + email);
            // Redirection ya backend API call yahan karein:
            // window.location.href = "/dashboard";
        }

        function socialLogin(provider) {
            alert("Login with " + provider + " clicked!");
        }
    </script>
</body>
</html>
