<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .qr {
            margin-top: 25px;
        }

        .qr img {
            width: 220px;
            height: 220px;
            border-radius: 10px;
        }

        .download {
            display: block;
            margin-top: 15px;
            padding: 13px;
            background: #e9e9e9;
            color: #111;
            text-decoration: none;
            border-radius: 10px;
        }

        .download:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QR Generator</h1>

    <p class="subtitle">
        Create a QR code instantly
    </p>

    <form method="POST">

        <input
            type="text"
            name="text"
            placeholder="Enter URL or text..."
            required
        >

        <button type="submit">
            Generate QR Code
        </button>

    </form>

    {% if qr_image %}

    <div class="qr">

        <img
            src="data:image/png;base64,{{ qr_image | b64encode }}"
            alt="QR Code"
        >

        <a href="/download" class="download">
            Download QR Code
        </a>

    </div>

    {% endif %}

</div>

</body>
</html>
